/RH/controller_manager:
  ros__parameters:
    update_rate: 1000 # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: forward_command_controller/ForwardCommandController

    reboot_controller:
      type: forward_command_controller/ForwardCommandController

/RH/joint_trajectory_controller:
  ros__parameters:
    joints:
      - RH_B2C
      - RH_C2F
      - RH_F2T
      - RH_T2E

    command_interfaces:
      - velocity

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 50.0  # [Hz]
    action_monitor_rate: 20.0

    allow_partial_joints_goal: false
    open_loop_control: false  # true: no feedback, false: use feedback
    allow_integration_in_goal_trajectories: true
    constraints:
      stopped_velocity_tolerance: 0.001
      goal_time: 0.0

    gains:
      RH_B2C:
        p: 10.0
        i: 0.1
        d: 0.1
        ff_velocity_scale: 1.0
      RH_C2F:
        p: 10.0
        i: 0.0
        d: 0.1
        ff_velocity_scale: 1.0
      RH_F2T:
        p: 10.0
        i: 0.0
        d: 0.1
        ff_velocity_scale: 1.0
      RH_T2E:
        p: 10.0
        i: 0.0
        d: 0.1
        ff_velocity_scale: 1.0

/RH/gripper_controller:
  ros__parameters:
    joints:
      - RH_gripper_joint
    interface_name: velocity

/RH/reboot_controller:
  ros__parameters:
    joints:
      - RH_B2C
      - RH_C2F
      - RH_F2T
      - RH_T2E
      - RH_E2G
      - RH_gripper_joint

    interface_name: reboot
